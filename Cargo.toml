[package]
name = "sshpass-win"
version = "1.0.1"
edition = "2021"
rust-version = "1.70"
description = "A drop-in sshpass for Windows: native password authentication for ssh, scp and sftp"
license = "MIT"
readme = "README.md"
repository = "https://github.com/zsyn666/sshpass-win"
homepage = "https://github.com/zsyn666/sshpass-win"
keywords = ["sshpass", "ssh", "scp", "sftp", "password"]
categories = ["command-line-utilities"]
exclude = ["/.github", "/.cargo-home", "/.build-tmp"]

[lib]
name = "sshpass_win"
path = "src/lib.rs"

[[bin]]
name = "sshpass"
path = "src/main.rs"
doc = false

# Test fixtures: tiny console programs that prompt for a password or echo
# stdin, so the engines can be tested without a remote host.
[[bin]]
name = "fake-prompt"
path = "src/bin/fake_prompt.rs"
doc = false
required-features = ["test-helpers"]

[[bin]]
name = "fake-input"
path = "src/bin/fake_input.rs"
doc = false
required-features = ["test-helpers"]

[dependencies]
portable-pty = "0.9"
ctrlc = "3"

[features]
default = []
test-helpers = []

[profile.release]
panic = "abort"
lto = true
opt-level = "s"
strip = true
